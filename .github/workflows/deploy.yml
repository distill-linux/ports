name: Build Ports & Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'recipes/**'
      - 'tools/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ports Repository
        uses: actions/checkout@v4

      - name: Build Recipes via Sink and Generate Catalog
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -w /work ghcr.io/void-linux/void-musl-full:latest sh -c '
            xbps-install -Syu && \
            xbps-install -y samurai bmake libgit2-devel libcurl-devel zlib-devel clang lld llvm git curl python3
            
            # Build sink tool from official repo
            git clone https://github.com/distill-linux/sink.git /tmp/sink-tool
            cd /tmp/sink-tool && samu && cd /work
            
            # Build all port recipes into packages directory
            mkdir -p packages
            for recipe in recipes/*.port; do
              [ -f "$recipe" ] || continue
              echo "==> Building $recipe..."
              /tmp/sink-tool/sink --out packages make "$recipe"
            done
            
            # Generate index.tsv and index.html
            chmod +x tools/gen-repo.sh
            ./tools/gen-repo.sh packages
          '

      - name: Deploy to distill-linux.github.io
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Distill Linux CI"
          git config --global user.email "ci@distilllinux.org"

          git clone https://x-access-token:${{ secrets.REPO_DISPATCH_PAT || github.token }}@github.com/distill-linux/distill-linux.github.io.git /tmp/pages-repo || {
            echo "Clone failed, creating repo locally"
            mkdir -p /tmp/pages-repo
            cd /tmp/pages-repo
            git init -b main
            git remote add origin https://x-access-token:${{ secrets.REPO_DISPATCH_PAT || github.token }}@github.com/distill-linux/distill-linux.github.io.git
          }
          
          # Copy packages and catalog to static/pkgs
          mkdir -p /tmp/pages-repo/static/pkgs
          cp -r packages/* /tmp/pages-repo/static/pkgs/
          
          cd /tmp/pages-repo
          git add -A
          git diff-index --quiet HEAD || {
            git commit -m "Automated update of official binary packages and index"
            git push origin main
          }
