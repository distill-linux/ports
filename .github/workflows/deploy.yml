name: Update Ports Catalog & Deploy to Website

on:
  push:
    branches: [ main ]
    paths:
      - 'recipes/**'
      - 'tools/**'
  workflow_dispatch:

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ports Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Clone Website Repository
        env:
          PAT: ${{ secrets.REPO_DISPATCH_PAT }}
        run: |
          git config --global user.name "Distill Linux Bot"
          git config --global user.email "bot@distilllinux.org"
          git clone "https://x-access-token:${PAT}@github.com/distill-linux/distill-linux.github.io.git" /tmp/pages-repo

      - name: Generate Catalog & Update Website Ports
        run: |
          chmod +x tools/gen-repo.sh
          ./tools/gen-repo.sh dist-packages recipes /tmp/pages-repo

      - name: Commit & Push to Website Repository
        run: |
          cd /tmp/pages-repo
          git add -A
          git diff-index --quiet HEAD || {
            git commit -m "Automated catalog update from ports repository"
            git push origin main
          }
